<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Try-On Store</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f9f9f9;
        }

        header {
            background-color: #222;
            color: white;
            padding: 1em;
            text-align: center;
        }

        header .btn {
            margin-top: 1em;
            display: inline-block;
        }

        .container {
            max-width: 1000px;
            margin: 2em auto;
            padding: 1em;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5em;
        }

        .product {
            background: white;
            border: 1px solid #ccc;
            padding: 1em;
            border-radius: 10px;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .product:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }

        .product img {
            max-width: 100%;
            height: auto;
            transition: transform 0.3s ease;
        }

        .product h3 {
            margin: 0.5em 0;
        }

        .btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 0.5em 1em;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .btn:hover {
            background-color: black;
            color: white;
        }

        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 1em;
            margin-top: 2em;
        }
    </style>
</head>
<body>
    <header>
        <h1>Virtual Try-On Clothing Store</h1>
        <a href="/start" class="btn">Start Virtual Try-On</a>
    </header>

    <div class="container">
        <h2>Shop Our Collection</h2>
        <div class="products">
            <div class="product">
                <img src="/Shirts/1.png" alt="Shirt 1">
                <h3>Classic White Shirt</h3>
                <p>349</p>
                <button class="btn">Add to Cart</button>
            </div>
            <div class="product">
                <img src="/Shirts/3.png" alt="Shirt 2">
                <h3>Modern Fit Shirt</h3>
                <p>399</p>
                <button class="btn">Add to Cart</button>
            </div>
            <div class="product">
                <img src="/Shirts/4.png" alt="Shirt 3">
                <h3>Denim Button-Up</h3>
                <p>499</p>
                <button class="btn">Add to Cart</button>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 Virtual Try-On Store. All rights reserved.</p>
    </footer>
</body>
</html>
